name: Sync Shared Config

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.claude/settings.json'
      - '.github/workflows/auto-pr-description.yml'
      - '.github/workflows/code-review.yml'
      - '.github/workflows/branch-base-check.yml'
      - '.github/workflows/pr-evidence-gate.yml'
      - '.github/workflows/sync-claude-config.yml'
      - '.github/workflows/shared-config-regression.yml'
      - '.github/scripts/test-sync-claude-config-contract.sh'
      - '.github/scripts/__tests__/*.test.cjs'
      - '.github/scripts/retrieve-context.sh'
      - '.github/scripts/test-retrieve-context.sh'
      - '.github/scripts/test-code-review-contract.sh'
      - '.github/scripts/check-pr-evidence.sh'
      - '.github/scripts/test-pr-evidence.sh'
      - '.github/scripts/review-knowledge.cjs'
      - '.github/review-knowledge/**'
  schedule:
    # 每週一 UTC 01:00 (台灣 09:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-shared-config
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared workflow contracts
        run: |
          node --test .github/scripts/__tests__/*.test.cjs
          bash .github/scripts/test-sync-claude-config-contract.sh

  sync:
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - daodao-f2e
          - daodao-server
          - daodao-ai-backend
          - daodao-storage
          - daodao-worker
          - daodao-infra
          - daodao-admin-ui
          - daodao-mcp
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ secrets.REPO_SYNC_TOKEN }}
          path: target

      - name: Sync settings, workflows, and review scripts
        run: |
          # 2026-09-21 起 hooks 與 skills 不再逐檔複製——那是漂移的來源。
          # 子專案只收一份 settings.json 指向 marketplace，內容由 daodao plugin 提供，
          # plugin 更新後子專案下次開 session 就拿到新版。
          mkdir -p target/.claude
          # del(.hooks) 不可省：`.[0] * .[1]` 是深合併，新的 settings.json 沒有 hooks 這個
          # key，所以子專案原本指向 .claude/hooks/*.sh 的設定會被「保留」下來——而那些檔案
          # 下一步就被刪掉，結果是每次 Write/Edit 都去執行一個不存在的檔案。
          if [ -f target/.claude/settings.json ]; then
            jq -s '.[0] * .[1] | del(.hooks)' target/.claude/settings.json .claude/settings.json > target/.claude/settings.json.tmp
            mv target/.claude/settings.json.tmp target/.claude/settings.json
          else
            jq 'del(.hooks)' .claude/settings.json > target/.claude/settings.json
          fi

          # 清掉舊版複本，避免與 plugin 版本並存後雙重觸發
          rm -f target/.claude/hooks/*.sh target/.claude/hooks/*.py target/.claude/hooks/profiles/*.json
          rmdir target/.claude/hooks/profiles target/.claude/hooks 2>/dev/null || true
          for skill in collect-pr-feedback code-review format-commit pre-commit-check post-merge-wrapup; do
            rm -rf "target/.claude/skills/$skill"
          done
          rmdir target/.claude/skills 2>/dev/null || true

          # Shared workflows
          mkdir -p target/.github/workflows
          for wf in auto-pr-description.yml code-review.yml branch-base-check.yml pr-evidence-gate.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              cp ".github/workflows/$wf" "target/.github/workflows/$wf"
            fi
          done

          # Trusted Context Pack runtime and regression contracts
          mkdir -p target/.github/scripts
          for script in retrieve-context.sh test-retrieve-context.sh test-code-review-contract.sh review-knowledge.cjs check-pr-evidence.sh test-pr-evidence.sh; do
            cp ".github/scripts/$script" "target/.github/scripts/$script"
            chmod +x "target/.github/scripts/$script"
          done

          # 誤判知識庫（單一來源在本 repo；sub-repo 只讀，CI 從 base ref 取用）
          mkdir -p target/.github/review-knowledge
          cp .github/review-knowledge/false-positives.jsonl .github/review-knowledge/README.md target/.github/review-knowledge/

      - name: Check for changes
        id: diff
        working-directory: target
        run: |
          if [ -z "$(git status --porcelain -- .claude .github/workflows .github/scripts .github/review-knowledge)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get default branch
        if: steps.diff.outputs.changed == 'true'
        id: default-branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          DEFAULT=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          echo "branch=$DEFAULT" >> $GITHUB_OUTPUT

      - name: Supersede older open sync PRs
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          # 每次同步都是「目前 daodao main vs 目標 base」的完整差異，新 PR 一定涵蓋舊 PR 還沒合的內容；
          # 舊的留著只會堆積（design-review F-11：infra／mcp 曾同時掛三張），直接關掉並留言指向新 run
          gh pr list --state open --search 'head:chore/sync-claude-config-' --json number,headRefName             --jq '.[] | select(.headRefName | startswith("chore/sync-claude-config-")) | .number'           | while read -r n; do
              gh pr close "$n" --delete-branch                 --comment "由較新的同步 run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} 取代（新 PR 含本 PR 全部未合內容），自動關閉。"                 && echo "closed superseded sync PR #$n"
            done

      - name: Create PR for checks
        if: steps.diff.outputs.changed == 'true'
        id: create-pr
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          DEFAULT_BRANCH: ${{ steps.default-branch.outputs.branch }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="chore/sync-claude-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add -f .claude/ .github/workflows/ .github/scripts/ .github/review-knowledge/
          git commit -m "chore: sync shared config from daodao

          Auto-synced settings (plugin enablement), workflows, and trusted review scripts from daodao"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: sync shared config" \
            --body "Auto-synced from daodao main ${GITHUB_SHA} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Updates settings (daodao plugin enablement), workflows, and trusted review scripts. Skills and hooks now ship via the daodao plugin, not as copied files. Content is a machine copy of files already reviewed and merged in daodao; this PR is merged automatically once the target repo's required checks pass." \
            --base "$DEFAULT_BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Shared config PR created: $PR_URL"

      - name: Merge now, or queue auto-merge until checks pass
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          # 內容是 daodao main 已 review 過的共享檔案，八個 repo 各再 review 一次只會卡住同步；
          # 但「不 review」不等於「不驗」——合併與否交給 GitHub 依各 repo 的 ruleset required checks 決定。
          #
          # 2026-09-20 改成 auto-merge：原本在這裡輪詢 `gh pr checks --watch`，需要 PAT 有 Checks: read，
          # fine-grained token 沒給就整天以 "Resource not accessible by personal access token" 失敗
          # （六張同步 PR 因此堆積）。auto-merge 由 GitHub 自己判斷 required checks，紅燈不會合，也不需要這個權限。
          #
          # 先試一般 merge：checks 已全綠時直接合完收工。失敗（多半是 checks 還在跑）才掛 auto-merge，
          # 這個順序讓整段完全不需要讀 checks 狀態。
          if gh pr merge "$PR_URL" --squash --delete-branch 2>/tmp/merge-err; then
            echo "Shared config PR merged: $PR_URL"
            echo "- Shared config PR merged: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat /tmp/merge-err
          PR_ID=$(gh pr view "$PR_URL" --json id -q .id)
          gh api graphql -f query='
            mutation($pr: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $pr, mergeMethod: SQUASH}) {
                pullRequest { number }
              }
            }' -f pr="$PR_ID"
          echo "Auto-merge queued; GitHub will merge once required checks pass: $PR_URL"
          echo "- Auto-merge queued (merges when required checks pass): $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          # 佇列後不再等待：checks 紅就不會合，PR 會留著。逾時未合由 session-start 的
          # 「同步 PR 卡住」提醒與每週 cron 的 stale-sync-prs job 抓出來，不靠這支 job 紅燈當訊號
          # （2026-09-20 的教訓：job 紅了一整天也沒人看）。

      - name: Report unqueued sync PR
        if: failure() && steps.create-pr.outputs.pr_url != ''
        env:
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          echo "- ⚠️ Shared config PR neither merged nor queued for auto-merge, needs a human: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
