name: Sync Shared Config

on:
  push:
    branches: [main]
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - '.claude/skills/collect-pr-feedback/**'
      - '.claude/skills/code-review/**'
      - '.github/workflows/auto-pr-description.yml'
      - '.github/workflows/code-review.yml'
      - '.github/workflows/branch-base-check.yml'
      - '.github/workflows/sync-claude-config.yml'
      - '.github/workflows/shared-config-regression.yml'
      - '.github/scripts/test-sync-claude-config-contract.sh'
      - '.github/scripts/__tests__/*.test.cjs'
      - '.github/scripts/retrieve-context.sh'
      - '.github/scripts/test-retrieve-context.sh'
      - '.github/scripts/test-code-review-contract.sh'
      - '.github/scripts/review-knowledge.cjs'
      - '.github/review-knowledge/**'
  schedule:
    # 每週一 UTC 01:00 (台灣 09:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-shared-config
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared workflow contracts
        run: |
          node --test .github/scripts/__tests__/*.test.cjs
          bash .github/scripts/test-sync-claude-config-contract.sh

  sync:
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - daodao-f2e
          - daodao-server
          - daodao-ai-backend
          - daodao-storage
          - daodao-worker
          - daodao-infra
          - daodao-admin-ui
          - daodao-mcp
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ secrets.REPO_SYNC_TOKEN }}
          path: target

      - name: Sync hooks, settings, and workflows
        run: |
          # Claude hooks + settings + profiles
          mkdir -p target/.claude/hooks/profiles
          cp .claude/hooks/*.sh target/.claude/hooks/
          chmod +x target/.claude/hooks/*.sh
          if [ -d .claude/hooks/profiles ]; then
            cp .claude/hooks/profiles/*.json target/.claude/hooks/profiles/
          fi

          if [ -f target/.claude/settings.json ]; then
            jq -s '.[0] * .[1]' target/.claude/settings.json .claude/settings.json > target/.claude/settings.json.tmp
            mv target/.claude/settings.json.tmp target/.claude/settings.json
          else
            cp .claude/settings.json target/.claude/settings.json
          fi

          # Shared skills
          for skill in collect-pr-feedback code-review format-commit pre-commit-check; do
            if [ -d ".claude/skills/$skill" ]; then
              mkdir -p "target/.claude/skills/$skill"
              cp ".claude/skills/$skill/SKILL.md" "target/.claude/skills/$skill/SKILL.md"
            fi
          done

          # Shared workflows
          mkdir -p target/.github/workflows
          for wf in auto-pr-description.yml code-review.yml branch-base-check.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              cp ".github/workflows/$wf" "target/.github/workflows/$wf"
            fi
          done

          # Trusted Context Pack runtime and regression contracts
          mkdir -p target/.github/scripts
          for script in retrieve-context.sh test-retrieve-context.sh test-code-review-contract.sh review-knowledge.cjs; do
            cp ".github/scripts/$script" "target/.github/scripts/$script"
            chmod +x "target/.github/scripts/$script"
          done

          # 誤判知識庫（單一來源在本 repo；sub-repo 只讀，CI 從 base ref 取用）
          mkdir -p target/.github/review-knowledge
          cp .github/review-knowledge/false-positives.jsonl .github/review-knowledge/README.md target/.github/review-knowledge/

      - name: Check for changes
        id: diff
        working-directory: target
        run: |
          if [ -z "$(git status --porcelain -- .claude .github/workflows .github/scripts .github/review-knowledge)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get default branch
        if: steps.diff.outputs.changed == 'true'
        id: default-branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          DEFAULT=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          echo "branch=$DEFAULT" >> $GITHUB_OUTPUT

      - name: Create PR for checks and review
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          DEFAULT_BRANCH: ${{ steps.default-branch.outputs.branch }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="chore/sync-claude-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add -f .claude/ .github/workflows/ .github/scripts/ .github/review-knowledge/
          git commit -m "chore: sync shared config from daodao

          Auto-synced hooks, settings, workflows, and trusted review scripts from daodao"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: sync shared config" \
            --body "Auto-synced from daodao. Updates hooks, settings, workflows, and trusted review scripts. Merge after CI checks and review; this workflow does not merge PRs." \
            --base "$DEFAULT_BRANCH")
          echo "PR awaiting checks and review: $PR_URL"
          echo "- Shared config PR awaiting checks and review: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
