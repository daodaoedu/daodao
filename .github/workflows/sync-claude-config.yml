name: Sync Shared Config

on:
  push:
    branches: [main]
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - '.claude/skills/collect-pr-feedback/**'
      - '.claude/skills/code-review/**'
      - '.github/workflows/auto-pr-description.yml'
      - '.github/workflows/code-review.yml'
      - '.github/workflows/branch-base-check.yml'
      - '.github/workflows/pr-evidence-gate.yml'
      - '.github/workflows/sync-claude-config.yml'
      - '.github/workflows/shared-config-regression.yml'
      - '.github/scripts/test-sync-claude-config-contract.sh'
      - '.github/scripts/__tests__/*.test.cjs'
      - '.github/scripts/retrieve-context.sh'
      - '.github/scripts/test-retrieve-context.sh'
      - '.github/scripts/test-code-review-contract.sh'
      - '.github/scripts/check-pr-evidence.sh'
      - '.github/scripts/test-pr-evidence.sh'
      - '.github/scripts/review-knowledge.cjs'
      - '.github/review-knowledge/**'
  schedule:
    # 每週一 UTC 01:00 (台灣 09:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-shared-config
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared workflow contracts
        run: |
          node --test .github/scripts/__tests__/*.test.cjs
          bash .github/scripts/test-sync-claude-config-contract.sh

  sync:
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - daodao-f2e
          - daodao-server
          - daodao-ai-backend
          - daodao-storage
          - daodao-worker
          - daodao-infra
          - daodao-admin-ui
          - daodao-mcp
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ secrets.REPO_SYNC_TOKEN }}
          path: target

      - name: Sync hooks, settings, and workflows
        run: |
          # Claude hooks + settings + profiles
          mkdir -p target/.claude/hooks/profiles
          cp .claude/hooks/*.sh target/.claude/hooks/
          chmod +x target/.claude/hooks/*.sh
          if [ -d .claude/hooks/profiles ]; then
            cp .claude/hooks/profiles/*.json target/.claude/hooks/profiles/
          fi

          if [ -f target/.claude/settings.json ]; then
            jq -s '.[0] * .[1]' target/.claude/settings.json .claude/settings.json > target/.claude/settings.json.tmp
            mv target/.claude/settings.json.tmp target/.claude/settings.json
          else
            cp .claude/settings.json target/.claude/settings.json
          fi

          # Shared skills
          for skill in collect-pr-feedback code-review format-commit pre-commit-check; do
            if [ -d ".claude/skills/$skill" ]; then
              mkdir -p "target/.claude/skills/$skill"
              cp ".claude/skills/$skill/SKILL.md" "target/.claude/skills/$skill/SKILL.md"
            fi
          done

          # Shared workflows
          mkdir -p target/.github/workflows
          for wf in auto-pr-description.yml code-review.yml branch-base-check.yml pr-evidence-gate.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              cp ".github/workflows/$wf" "target/.github/workflows/$wf"
            fi
          done

          # Trusted Context Pack runtime and regression contracts
          mkdir -p target/.github/scripts
          for script in retrieve-context.sh test-retrieve-context.sh test-code-review-contract.sh review-knowledge.cjs check-pr-evidence.sh test-pr-evidence.sh; do
            cp ".github/scripts/$script" "target/.github/scripts/$script"
            chmod +x "target/.github/scripts/$script"
          done

          # 誤判知識庫（單一來源在本 repo；sub-repo 只讀，CI 從 base ref 取用）
          mkdir -p target/.github/review-knowledge
          cp .github/review-knowledge/false-positives.jsonl .github/review-knowledge/README.md target/.github/review-knowledge/

      - name: Check for changes
        id: diff
        working-directory: target
        run: |
          if [ -z "$(git status --porcelain -- .claude .github/workflows .github/scripts .github/review-knowledge)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get default branch
        if: steps.diff.outputs.changed == 'true'
        id: default-branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          DEFAULT=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          echo "branch=$DEFAULT" >> $GITHUB_OUTPUT

      - name: Supersede older open sync PRs
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          # 每次同步都是「目前 daodao main vs 目標 base」的完整差異，新 PR 一定涵蓋舊 PR 還沒合的內容；
          # 舊的留著只會堆積（design-review F-11：infra／mcp 曾同時掛三張），直接關掉並留言指向新 run
          gh pr list --state open --search 'head:chore/sync-claude-config-' --json number,headRefName             --jq '.[] | select(.headRefName | startswith("chore/sync-claude-config-")) | .number'           | while read -r n; do
              gh pr close "$n" --delete-branch                 --comment "由較新的同步 run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} 取代（新 PR 含本 PR 全部未合內容），自動關閉。"                 && echo "closed superseded sync PR #$n"
            done

      - name: Create PR for checks
        if: steps.diff.outputs.changed == 'true'
        id: create-pr
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          DEFAULT_BRANCH: ${{ steps.default-branch.outputs.branch }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="chore/sync-claude-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add -f .claude/ .github/workflows/ .github/scripts/ .github/review-knowledge/
          git commit -m "chore: sync shared config from daodao

          Auto-synced hooks, settings, workflows, and trusted review scripts from daodao"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: sync shared config" \
            --body "Auto-synced from daodao main ${GITHUB_SHA} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Updates hooks, settings, workflows, and trusted review scripts. Content is a machine copy of files already reviewed and merged in daodao; this PR is merged automatically once the target repo's required checks pass." \
            --base "$DEFAULT_BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Shared config PR created: $PR_URL"

      - name: Wait for required checks, then merge
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          DEFAULT_BRANCH: ${{ steps.default-branch.outputs.branch }}
        run: |
          # 內容是 daodao main 已 review 過的共享檔案，八個 repo 各再 review 一次只會卡住同步（2026-09-20 admin-ui／storage／ai-backend
          # 三張同步 PR 被 REVIEW_REQUIRED 擋住，人工 --admin 才合得進去）。這裡只放行「required checks 全綠」的 PR：
          # 紅燈或 30 分鐘沒等到就留 PR、job 失敗，不硬合。
          REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)
          # 剛開 PR 時 check run 可能還沒註冊，先等 rollup 出現
          for _ in $(seq 1 18); do
            n=$(gh pr view "$PR_URL" --json statusCheckRollup -q '.statusCheckRollup | length' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && break
            sleep 10
          done
          REQUIRED=$(gh api "repos/${REPO}/rules/branches/${DEFAULT_BRANCH}"             --jq '[.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | length' 2>/dev/null || echo 0)
          if [ "${REQUIRED:-0}" -gt 0 ]; then
            echo "waiting for ${REQUIRED} required check(s)"
            gh pr checks "$PR_URL" --required --watch --fail-fast
          else
            # 沒設 required checks 的 repo：等全部 check 完成（永不回報的外部 check 由 timeout-minutes 兜底）
            echo "no required checks on ${DEFAULT_BRANCH}; waiting for all checks"
            gh pr checks "$PR_URL" --watch --fail-fast
          fi
          # 2026-09-20 起各 repo 的 ruleset 移除了 admin bypass（bypass_actors 清空），--admin 不再能繞過任何規則，
          # 只會讓這一步以難懂的錯誤收場；同時所有 pull_request 規則都改成 approvals=0，本來就不需要繞 review。
          # checks 已在上面確認全綠，這裡用一般 merge；真的被擋就讓 job 紅，由下一步回報給人。
          gh pr merge "$PR_URL" --squash --delete-branch
          echo "Shared config PR merged after required checks: $PR_URL"
          echo "- Shared config PR merged after required checks: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Report unmerged sync PR
        if: failure() && steps.create-pr.outputs.pr_url != ''
        env:
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          echo "- ⚠️ Shared config PR NOT merged (checks failed or timed out), needs a human: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
