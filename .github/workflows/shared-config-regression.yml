name: Shared Config Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required workflow triggers
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -m unittest discover -s scripts/__tests__ -p 'test_required_workflow_triggers.py' -v
          python3 -m unittest discover -s scripts/__tests__ -p 'test_collect_gate_protection.py' -v
      - name: Check shared workflow contracts
        run: |
          node --test .github/scripts/__tests__/*.test.cjs
          bash .github/scripts/test-sync-claude-config-contract.sh
      - name: Dev-task gates regression (pre-pr hook, PR evidence CI gate, validation parity)
        run: |
          bash .github/scripts/test-pre-pr-gate.sh
          bash .github/scripts/test-pr-evidence.sh
          python3 -m unittest discover -s scripts/__tests__ -p 'test_validation_parity.py' -v

      - name: Plugin artifacts in sync with canonical skills
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm plugin:check
          pnpm vitest run plugin/scripts/__tests__/
