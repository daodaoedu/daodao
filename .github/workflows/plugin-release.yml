name: Publish plugin release

# plugin 的散佈走 GitHub Release 的 zip，不走 marketplace clone：
# 從 repo 裝 marketplace 會 git clone 整個 monorepo（12MB）只為了拿 163KB 的 plugin。
# archive 來源是單純 HTTPS 下載，使用者不需要 git 也不需要 npm。
#
# marketplace.json 另外發到 GitHub Pages：`claude plugin marketplace add` 看到 github.com 的
# https 網址一律當成 git repo 去 clone（官方 marketplace reference 的規則），release 下載網址
# 因此不能拿來 add。Pages 網址不在 github.com 底下，會被當成 marketplace.json 直接下載。
#
# 觸發：main 上 plugin/ 有變更就發新版。版號自動產生：major.minor 取 plugin.json，
# patch 用這個 workflow 的 run number——合 PR 就等於發版，不需要人記得 bump。
# 同一個 run 重跑（run number 不變）會撞到已發佈的 tag 而跳過，不覆蓋已釘 sha256 的資產。

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Artifacts in sync with canonical skills
        run: |
          pnpm plugin:check
          pnpm vitest run plugin/scripts/__tests__/

      - name: Read version
        id: meta
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(jq -r .version plugin/.claude-plugin/plugin.json | cut -d. -f1,2)
          VERSION="$BASE.$RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=plugin-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # 已發佈的 zip 其 sha256 被 marketplace.json 釘住，重發同版本會讓已安裝的人對不上。
          # 只有 Re-run 同一個 run 才會走到這裡（run number 不變）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # release 建好之後 Pages 部署失敗時，重跑要能補部署——但只限這個 tag 仍是最新版，
            # 否則重跑舊的 run 會把 Pages 退回舊版。
            LATEST=$(gh release view --json tagName -q .tagName)
            if [ "$LATEST" = "$TAG" ]; then
              echo "publish_pages=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG 已存在，不重發 release，只重新部署 Pages。"
            else
              echo "publish_pages=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG 已存在且不是最新版（最新 $LATEST），跳過。要重發請從 Actions 手動觸發新的 run。"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publish_pages=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          pnpm plugin:package --version "$VERSION" --url \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/daodao-plugin-${VERSION}.zip"
          ls -l plugin/out/release/

      - name: Configure Pages
        if: steps.check.outputs.publish_pages == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          SHA=$(jq -r '.plugins[0].source.sha256' plugin/out/release/marketplace.json)
          gh release create "$TAG" \
            "plugin/out/release/daodao-plugin-${VERSION}.zip" \
            "plugin/out/release/marketplace.json" \
            --title "daodao plugin v${VERSION}" \
            --notes "$(cat <<EOF
          安裝（不需要 clone 這個 repo）：

          \`\`\`
          /plugin install daodao@daodao
          \`\`\`

          repo 的 \`.claude/settings.json\` 已宣告 marketplace，所以開過本 repo 或任一子專案的人
          不需要另外 add marketplace。

          沒有 repo 的人一行裝好：

          \`\`\`
          claude plugin install daodao --marketplace ${PAGES_URL%/}/marketplace.json
          \`\`\`

          archive sha256: \`${SHA}\`

          zip 是可重現的：同一份 commit 在本機跑 \`pnpm plugin:package --version ${VERSION}\` 會得到同一個 sha256。
          EOF
          )"
          echo "- 發佈 $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage marketplace.json for Pages
        if: steps.check.outputs.publish_pages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTS: ${{ steps.check.outputs.exists }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p _site
          if [ "$EXISTS" = "true" ]; then
            # 重跑補部署：用已發佈 release 上的那份，sha256 才會對得上已上傳的 zip
            gh release download "$TAG" -p marketplace.json -D _site --clobber
          else
            cp plugin/out/release/marketplace.json _site/marketplace.json
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.publish_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        if: steps.check.outputs.publish_pages == 'true'
        uses: actions/deploy-pages@v4

      - name: Verify the published marketplace resolves
        if: steps.check.outputs.publish_pages == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # 使用者實際 add 的是 Pages 上的 marketplace.json：要真的抓得到、版號是這次的，
          # 而且它指向的 zip sha256 對得上——否則使用者會撞到
          # "Plugin archive integrity check failed"，而我們到那時才知道就太晚了。
          # Pages 有 CDN 快取，部署完可能還拿到舊版，重試幾次。
          got_version() { jq -r '.plugins[0].version' /tmp/mp.json 2>/dev/null; }
          rm -f /tmp/mp.json
          for i in 1 2 3 4 5 6; do
            curl -fsSL -H 'Cache-Control: no-cache' "${PAGES_URL%/}/marketplace.json?v=${VERSION}" -o /tmp/mp.json \
              && [ "$(got_version)" = "$VERSION" ] && break
            echo "Pages 還沒更新到 $VERSION，等 20 秒（第 $i 次）"; sleep 20
          done
          [ "$(got_version)" = "$VERSION" ] || { echo "❌ Pages 上的 marketplace.json 不是 $VERSION（拿到：$(got_version || echo 下載失敗)）"; exit 1; }
          jq -e '.plugins[0].source.source == "archive"' /tmp/mp.json >/dev/null
          URL=$(jq -r '.plugins[0].source.url' /tmp/mp.json)
          WANT=$(jq -r '.plugins[0].source.sha256' /tmp/mp.json)
          curl -fsSL "$URL" -o /tmp/plugin.zip
          GOT=$(sha256sum /tmp/plugin.zip | cut -d' ' -f1)
          [ "$WANT" = "$GOT" ] || { echo "❌ sha256 不符: want=$WANT got=$GOT"; exit 1; }
          echo "✅ Pages 上的 marketplace.json（$VERSION）與 zip 都抓得到，sha256 相符（$GOT）"
