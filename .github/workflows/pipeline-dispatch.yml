name: Pipeline — Board → Sub-repo Dispatch (Routine A)

on:
  schedule:
    - cron: '7 * * * *'  # hourly UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual changes)'
        type: boolean
        default: false

jobs:
  dispatch:
    name: Dispatch Ready-for-Dev cards to sub-repos
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline-dispatch
        env:
          # PAT with repo + project scope (org project item-list/item-edit and cross-repo issues)
          GH_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          pnpm tsx bin/pipeline/dispatch.ts $ARGS
