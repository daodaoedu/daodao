name: Pipeline — Merged PR → Board Done (Routine C)

on:
  schedule:
    - cron: '37 * * * *'  # hourly UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual changes)'
        type: boolean
        default: false
      hours:
        description: 'Lookback window in hours (default: 48)'
        type: string
        default: '48'

jobs:
  board-sync:
    name: Sync merged auto PRs back to the Planning board
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline-board-sync
        env:
          # PAT with repo + project scope (org project item-edit and cross-repo issues/PRs)
          GH_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.hours }}" ]; then ARGS="$ARGS --hours ${{ inputs.hours }}"; fi
          pnpm tsx bin/pipeline/board-sync.ts $ARGS
