name: Reusable Deploy Pipeline

# Shared CD skeleton for daodao sub-repos.
# Caller 負責 CI gate（workflow_call 自己的 ci.yml），
# 這裡只管 Docker build → SSH deploy → Discord notify。
#
# 用法（caller 的 cd.yml）：
#   jobs:
#     ci:
#       uses: ./.github/workflows/ci.yml
#       secrets: inherit
#     deploy:
#       needs: ci
#       uses: ./.github/workflows/_deploy.yml
#       with:
#         docker-image-name: daodao-admin-ui
#         deploy-path: /root/daodao-admin-ui
#       secrets: inherit

on:
  workflow_call:
    inputs:
      docker-image-name:
        description: 'Docker Hub image name (e.g. daodao-admin-ui). Empty = skip Docker Hub build.'
        type: string
        required: false
        default: ''
      deploy-path:
        description: 'Remote path on the deploy host (e.g. /root/daodao-server)'
        type: string
        required: true
      deploy-script:
        description: 'Path to repo-specific deploy script. Receives env vars: APP_ENV, IMAGE_TAG, COMMIT_SHA, BRANCH_NAME, DEPLOY_PATH, COMPOSE_FILE'
        type: string
        required: false
        default: ''
      timeout-minutes:
        description: 'Deploy job timeout'
        type: number
        required: false
        default: 20
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
      LINODE_SSH_PRIVATE_KEY:
        required: true
      LINODE_INSTANCE_IP:
        required: true
      DISCORD_WEBHOOK_URL:
        required: false
      GIT_HUB_USERNAME:
        required: false
      GIT_HUB_ACCESS_TOKEN:
        required: false

jobs:
  detect-env:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.env.outputs.image-tag }}
      app-env: ${{ steps.env.outputs.app-env }}
      compose-file: ${{ steps.env.outputs.compose-file }}
    steps:
      - name: Detect environment from branch
        id: env
        run: |
          REF="${{ github.ref }}"
          case "$REF" in
            refs/heads/main|refs/heads/production)
              echo "image-tag=prod" >> "$GITHUB_OUTPUT"
              echo "app-env=prod" >> "$GITHUB_OUTPUT"
              echo "compose-file=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "image-tag=dev" >> "$GITHUB_OUTPUT"
              echo "app-env=dev" >> "$GITHUB_OUTPUT"
              echo "compose-file=docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              ;;
          esac

  docker-build:
    runs-on: ubuntu-latest
    needs: [detect-env]
    if: ${{ inputs.docker-image-name != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ inputs.docker-image-name }}:${{ needs.detect-env.outputs.image-tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ inputs.docker-image-name }}:${{ needs.detect-env.outputs.image-tag }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/${{ inputs.docker-image-name }}:${{ needs.detect-env.outputs.image-tag }}
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-env, docker-build]
    if: ${{ always() && (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') }}
    environment: ${{ needs.detect-env.outputs.app-env == 'dev' && 'development' || 'production' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        id: deploy
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          APP_ENV: ${{ needs.detect-env.outputs.app-env }}
          IMAGE_TAG: ${{ needs.detect-env.outputs.image-tag }}
          COMPOSE_FILE: ${{ needs.detect-env.outputs.compose-file }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
          GIT_HUB_USERNAME: ${{ secrets.GIT_HUB_USERNAME }}
          GIT_HUB_ACCESS_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.deploy-script }}" ] && [ -f "${{ inputs.deploy-script }}" ]; then
            bash "${{ inputs.deploy-script }}"
          else
            ssh -o StrictHostKeyChecking=no \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=3 \
                -o ConnectTimeout=10 \
                root@$LINODE_INSTANCE_IP bash -s << 'ENDSSH'
              set -e
              echo "=== Deploy $APP_ENV to $DEPLOY_PATH ==="

              if [ -d "$DEPLOY_PATH/.git" ]; then
                cd "$DEPLOY_PATH"
                git fetch --depth 1 origin "$BRANCH_NAME"
                git reset --hard FETCH_HEAD
                git clean -fd -e '.env*' -e 'logs/'
              else
                git clone --depth 1 --branch "$BRANCH_NAME" \
                  "https://${GIT_HUB_USERNAME}:${GIT_HUB_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$DEPLOY_PATH"
                cd "$DEPLOY_PATH"
              fi

              echo "=== Pulling image ==="
              DOCKER_HUB_USERNAME="$DOCKER_HUB_USERNAME" \
              IMAGE_TAG="$IMAGE_TAG" \
              COMMIT_SHA="$COMMIT_SHA" \
                docker compose -f "$COMPOSE_FILE" pull || true

              echo "=== Starting containers ==="
              DOCKER_HUB_USERNAME="$DOCKER_HUB_USERNAME" \
              IMAGE_TAG="$IMAGE_TAG" \
              COMMIT_SHA="$COMMIT_SHA" \
                docker compose -f "$COMPOSE_FILE" up -d --wait --wait-timeout 90

              docker image prune -f --filter "until=24h" || true
              echo "=== Deploy complete ==="
          ENDSSH
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [detect-env, deploy]
    if: always()
    steps:
      - name: Send Discord Notification
        run: |
          WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"
          [ -z "$WEBHOOK_URL" ] && echo "No webhook configured" && exit 0

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          IMAGE_TAG="${{ needs.detect-env.outputs.image-tag }}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          DEPLOY_STATUS="${{ needs.deploy.result }}"

          if [ "$DEPLOY_STATUS" = "failure" ]; then
            COLOR=16711680; TITLE="❌ Deploy Failed ($IMAGE_TAG)"
          elif [ "$DEPLOY_STATUS" = "cancelled" ]; then
            COLOR=8421504; TITLE="⚠️ Deploy Cancelled"
          elif [ "$DEPLOY_STATUS" = "success" ]; then
            COLOR=3066993; TITLE="✅ Deploy Success ($IMAGE_TAG)"
          else
            COLOR=16776960; TITLE="❓ Unknown Status"
          fi

          curl -s -o /dev/null -w '' -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$TITLE\",
              \"color\": $COLOR,
              \"fields\": [
                {\"name\": \"Repo\", \"value\": \"$REPO\", \"inline\": true},
                {\"name\": \"Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/${{ github.sha }})\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" "$WEBHOOK_URL" || echo "::warning::Discord notification failed"
