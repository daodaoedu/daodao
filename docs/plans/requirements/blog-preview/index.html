const data={zh:{about:'關於島島',preview:'版型預覽 · 示範文章，非正式內容',list:'文章列表',article:'文章頁',theme:'切換深淺色',switchlang:'切換為英文',topiclabel:'文章主題',home:'島島阿學首頁',intro:'陪伴學習，也讓帶領更從容。',desc:'寫給講師、教練與社群帶領者的實作筆記。',topics:['全部文章','活動設計','成員參與','成果回顧','工具與方法'],author:'島島編輯團隊',back:'返回所有文章',cta:'把下一場共學，帶得更從容',ctadesc:'燈塔正在免費封閉測試中。留下你的需求，團隊會寄送邀請；需要 Demo，也會與你聯絡安排。',ctabtn:'申請免費封測',related:'繼續閱讀',foot:'好的學習，從彼此連結開始。',empty:'這個主題的文章正在準備中。',posts:[['一場工作坊結束後，如何讓學習繼續發生？','把課堂上的靈感，接成接下來兩週做得到的練習。從一個小任務開始，讓回饋與同伴互動有機會發生。','活動設計','7'],['學員沒有回應時，先看見他卡在哪裡','沉默不一定是沒有意願。從任務設計、回應門檻到回饋節奏，找到下一個可以調整的地方。','成員參與','5'],['LINE、表單和學習平台，各自適合做什麼？','訊息、作業與學習紀錄，不必全塞進同一個工具。先釐清帶領過程的工作，再決定怎麼分工。','工具與方法','6']]},en:{about:'About Dao Dao',preview:'Layout preview · Sample stories, unpublished',list:'All stories',article:'Article page',theme:'Switch color theme',switchlang:'Switch to Traditional Chinese',topiclabel:'Story topics',home:'Dao Dao home',intro:'More room for meaningful learning.',desc:'Practical notes for teachers, coaches, and community facilitators.',topics:['All stories','Program design','Participation','Reflection','Tools & methods'],author:'Dao Dao editorial team',back:'Back to all stories',cta:'Make room for better learning experiences',ctadesc:'Lighthouse is in free closed beta. Tell us what you need and our team will follow up with an invitation. We can also arrange a demo.',ctabtn:'Apply for the free beta',related:'Keep reading',foot:'Better learning starts with connection.',empty:'Stories on this topic are on their way.',posts:[['How do you keep learning going after a workshop?','Turn the ideas from a workshop into small, achievable practices over the next two weeks. Start with one task and leave room for feedback.','Program design','7'],['When learners go quiet, find where they are stuck','Silence does not always mean a lack of interest. Look at the task, the effort of responding, and your feedback rhythm.','Participation','5'],['Where do chat, forms, and learning platforms fit?','Messages, assignm const bodies={zh:`<p>工作坊最後，大家帶著想法離開。真正的挑戰往往在隔天：回到日常之後，要從哪一步開始？</p><p>帶領者可以先準備一段短短的延伸實踐，讓參與者知道下一步、有人可以回應，也能看見自己留下的紀錄。</p><h2>先選一件兩天內能完成的事</h2><p>與其安排完整的大作業，先請參與者選擇一個小場景，把課堂上的方法試用一次。任務越明確，越容易知道何時開始、做到哪裡就可以留下紀錄。</p><blockquote>「這週找一次真實對話，試著先問一個開放式問題，再記下對方的反應。」</blockquote><p>這比「持續練習溝通技巧」更容易執行，也讓帶領者知道可以在哪裡提供回饋。</p><h2>讓回應有一個輕巧的起點</h2><p>不必每次都寫長篇心得。先用三個問題，幫大家留下足以接續對話的線索。</p><div class="example"><p><strong>一次練習的紀錄</strong></p><p>我在哪個情境試了？<br>發生了什麼，跟預期有何不同？<br>下一次，我想調整什麼？</p></div><h2>先約好回顧的時間</h2><p>開始之前，就告訴大家何時會一起回看這段實踐。帶領者不用回覆每一則紀錄，可以先聚焦在求助、共同困難和值得彼此借用的做法。</p><p>這份示範提供一個活動設計思路。任務長度與互動頻率仍需依參與者的情境調整，不代表任何成效保證。</p>`,en:`<p>A workshop ends with ideas and energy. The next challenge arrives the following day: where do people start once they return to their routines?</p><p>A short period of follow-up practice can give participants a clear next step, space for a response, and a record they can return to.</p><h2>Choose one thing to try within two days</h2><p>Instead of a large assignment, ask each person to apply one method in a small, real situation. Make it clear when to begin and what counts as enough to record.</p><blockquote>“In one conversation this week, ask an open-ended question first. Note how the other person responds.”</blockquote><p>This is easier to act on than “keep practicing communication,” and gives a facilitator something specific to respond to.</p><h2>Make responding feel manageable</h2><p>A reflection does not have to become an essay. Three prompts can leave enough context for a useful conversation.</p><div class="example"><p><strong>A short practice note</strong></p><p>Where did I try it?<br>What happened, and how did it differ from my expectation?<br>What would I change next time?</p></div><h2>Agree on a time to look back</h2><p>Before starting, tell participants when you will review the practice together. You can focus feedback on requests for help, shared difficulties, and approaches others can borrow.</p><p>This example illustrates one way to design a learning activity. Adapt the task and rhythm to your participants; it is not a promise of results.</p>`};

: "Discord", "footer_copyright": "Dao Dao Learning Co., Ltd. © 2022 - {year}"}};function renderFooter(){const t=footerCopy[lang],base='https://daodao.so'+(lang==='en'?'/en':'');const link=(path,key)=>`<a href="${base+path}" target="_blank" rel="noopener">${t[key]}</a>`;el('sitefooter').innerHTML=`<div class="footer-head"><div><img class="footer-logo" src="${lang==='en'?'brand-en-white.svg':'brand-zh-white.svg'}" alt="${lang==='en'?'Dao Dao':'島島阿學'}"><p class="footer-tagline">${t.footer_tagline}</p></div></div><div class="footer-grid"><section><h2>${t.footer_about_title}</h2>${link('/about','footer_about_us')}${link('/about#vision','footer_vision')}${link('/about#mission','footer_mission')}<a href="https://app.daodao.so/roadmap" target="_blank" rel="noopener">${t.footer_roadmap}</a></section><section><h2>${t.footer_resources_title}</h2><a href="https://app.daodao.so/resource" target="_blank" rel="noopener">${t.footer_learning_resources}</a>${link('/learning-marathons/2025S1','footer_learning_marathons')}${link('/terms/privacy-policy','footer_privacy_policy')}${link('/terms/service','footer_terms_of_service')}${link('/terms/ipr','footer_intellectual_property')}</section><section><h2>${t.footer_newsletter_title}</h2><p>${lang==='en'?'Receive news and stories from Dao Dao.':'接收島島的最新消息與學習故事。'}</p><a href="${base}/" target="_blank" rel="noopener">${lang==='en'?'Subscribe on our website':'前往主站訂閱'}</a></section></div><div class="footer-social"><a href="https://www.instagram.com/daodao_learn/" target="_blank" rel="noopener">Instagram</a><a href="https://www.facebook.com/daodao.edu/" target="_blank" rel="noopener">Facebook</a><a href="https://discord.gg/FdFCxUwg83" target="_blank" rel="noopener">Discord</a><a href="mailto:contact@daodao.so">contact@daodao.so</a></div><p class="footer-copyright">${t.footer_copyright.replace('{year}',new Date().getFullYear())}</p>`;el('sitefooter').querySelectorAll('[data-lang]').forEach(n=>n.onclick=()=>{lang=n.dataset.lang;render()})}

const formatFixtures={zh:`<h2>常見內容格式</h2><p>以下是排版測試素材，並非產品功能或研究結論。連結使用底線，包含<strong>重點文字</strong>與<em>語意強調</em>，行內欄位如 <code>article_id</code> 也能清楚辨識。</p><h3>步驟與清單</h3><ol><li>先說清楚參與者要完成的事。</li><li>提供一個可操作的範例。<ul><li>補充條件與例外。</li><li>保留具體的回顧問題。</li></ul></li><li>留下後續回應的方式。</li></ol><h3>比較表格</h3><div class="table-scroll" role="region" aria-label="排版範例比較表" tabindex="0"><table><caption>不同格式的呈現方式（示意）</caption><thead><tr><th scope="col">格式</th><th scope="col">適用內容</th><th scope="col">閱讀方式</th></tr></thead><tbody><tr><th scope="row">段落</th><td>連續論述、解釋與限制</td><td>自然換行</td></tr><tr><th scope="row">表格</th><td>多項條件的並列比較</td><td>窄螢幕可在表格內橫向捲動</td></tr></tbody></table></div><h3>圖片與說明</h3><figure><img src="brand-zh.svg" width="859" height="190" alt="島島阿學：彩色群島圖形與中文品牌名稱" loading="lazy"><figcaption>正式品牌素材。圖說與替代文字各自提供合適脈絡。</figcaption></figure><h3>長網址與程式區塊</h3><p><a href="https://example.com/">https://example.com/format-preview/long-resource-name-without-spaces-for-narrow-screen-verification</a></p><pre tabindex="0" aria-label="設定資料範例"><code>{ "article_id": "workshop-follow-up", "translation_id": "workshop-follow-up", "status": "draft" }</code></pre><hr><h3>參考資料</h3><ul><li><a href="https://www.w3.org/WAI/tutorials/page-structure/headings/" target="_blank" rel="noopener">W3C：標題層級</a></li></ul>`,en:`<h2>Common content formats</h2><p>These are layout fixtures, not product claims or research findings. Links are underlined. <strong>Important text</strong>, <em>emphasis</em>, and inline fields such as <code>article_id</code> remain distinct.</p><h3>Steps and lists</h3><ol><li>Describe a clear task.</li><li>Give an actionable example.<ul><li>Include relevant conditions.</li><li>Leave a concrete reflection prompt.</li></ul></li><li>Explain how participants can respond.</li></ol><h3>Comparison table</h3><div class="table-scroll" role="region" aria-label="Example comparison table" tabindex="0"><table><caption>How formats behave (illustrative)</caption><thead><tr><th scope="col">Format</th><th scope="col">Content</th><th scope="col">Reading behavior</th></tr></thead><tbody><tr><th scope="row">Paragraph</th><td>Arguments, explanations, and limitations</td><td>Wraps naturally</td></tr><tr><th scope="row">Table</th><td>Comparisons across multiple conditions</td><td>Scrolls within its own region on narrow screens</td></tr></tbody></table></div><h3>Images and captions</h3><figure><img src="brand-en.svg" width="788" height="190" alt="Dao Dao logo with colorful island shapes and the English wordmark" loading="lazy"><figcaption>Approved brand artwork shown as an image-format example.</figcaption></figure><h3>Long links and code</h3><p><a href="https://example.com/">https://example.com/format-preview/long-resource-name-without-spaces-for-narrow-screen-verification</a></p><pre tabindex="0" aria-label="Example configuration"><code>{ "article_id": "workshop-follow-up", "translation_id": "workshop-follow-up", "status": "draft" }</code></pre><hr><h3>References</h3><ul><li><a href="https://www.w3.org/WAI/tutorials/page-structure/headings/" target="_blank" rel="noopener">W3C: Heading structure</a></li></ul>`};

let lang='zh',filter=0;const el=id=>document.getElementById(id);function art(i){return `<svg viewBox="0 0 150 100" fill="none" aria-hidden="true"><path d="M8 80 Q42 54 72 78 T145 76" stroke="currentColor" stroke-width="1.5"/><path d="M${30+i*8} 63 L${48+i*8} 24 L${68+i*8} 63 Z" fill="currentColor" opacity=".2"/><circle cx="105" cy="29" r="14" stroke="currentColor" stroke-width="1.5"/><path d="M35 80V58M47 80V51M59 80V63M100 73V48M111 73V55" stroke="currentColor" stroke-width="2"/></svg>`}function render(){const d=data[lang];document.documentElement.lang=lang==='zh'?'zh-Hant':'en';el('previewlabel').textContent=d.preview;el('showlist').textContent=d.list;el('showarticle').textContent=d.article;el('showformats').textContent=lang==='zh'?'格式範例':'Format examples';el('skip').textContent=lang==='zh'?'跳至主要內容':'Skip to main content';el('theme').setAttribute('aria-label',d.theme);el('lang').setAttribute('aria-label',d.switchlang);el('topics').setAttribute('aria-label',d.topiclabel);el('navcta').textContent=d.ctabtn;document.querySelector('.brand').setAttribute('aria-label',d.home);document.querySelector('.logo-light').src=lang==='zh'?'brand-zh.svg':'brand-en.svg';document.querySelector('.logo-dark').src=lang==='zh'?'brand-zh-white.svg':'brand-en-white.svg';document.title=lang==='zh'?'島島 Journal｜版型預覽':'Dao Dao Journal | Layout preview';el('lang').textContent=lang==='zh'?'EN':'繁中';el('introtitle').textContent=d.intro;el('introdesc').textContent=d.desc;el('topics').innerHTML=d.topics.map((t,i)=>`<button class="${filter===i?'active':''}" aria-pressed="${filter===i}" data-filter="${i}">${t}</button>`).join('');let count=0;el('posts').innerHTML=d.posts.map((p,i)=>{if(filter&&p[2]!==d.topics[filter])return '';count++;return `<a class="post" href="#article-${i}"><div><div class="by"><span class="dot">島</span>${d.author}</div><h2>${p[0]}</h2><p>${p[1]}</p><div class="meta"><span>${lang==='zh'?'示範文章':'Sample story'}</span><span>${p[3]} ${lang==='zh'?'分鐘閱讀':'min read'}</span><span class="tag">${p[2]}</span></div></div><div class="art">${art(i)}</div></a>`}).join('');el('empty').classList.toggle('hidden',!!count);el('empty').textContent=d.empty;el('back').textContent=d.back;el('authorname').textContent=d.author;renderFooter();for(const [id,key]of[['ctatitle','cta'],['ctadesc','ctadesc'],['ctalink','ctabtn'],['relatedtitle','related']])el(id).textContent=d[key];el('related1').textContent=d.posts[1][0];el('related2').textContent=d.posts[2][0];route()}function route(){const show=location.hash.startsWith('#article');el('listing').classList.toggle('hidden',show);el('article').classList.toggle('hidden',!show);const i=Math.min(2,Math.max(0,Number(location.hash.split('-')[1])||0));const p=data[lang].posts[i];el('atitle').textContent=p[0];el('adek').textContent=p[1];el('ameta').textContent=lang==='zh'?'版型示範 · 內容未發布':'Layout sample · Unpublished';el('body').innerHTML=i===0?bodies[lang]:`<p>${p[1]}</p><h2>${lang==='zh'?'先從一個真實情境開始':'Start with a real situation'}</h2><p>${lang==='zh'?'這個頁面示範較短文章的排版。完整文章將依核准稿呈現，不以示範內容作產品功能或成效承諾。':'This shorter page demonstrates the article layout. Published stories will use approved copy. This sample makes no product or outcome claims.'}</p>`}const renderArticle=route;route=function(){renderArticle();if(location.hash==='#article-formats'){el('body').innerHTML=formatFixtures[lang];el('atitle').textContent=lang==='zh'?'文章格式與排版範例':'Article format examples';el('adek').textContent=lang==='zh'?'清單、表格、圖片與程式區塊的閱讀預覽。':'A reading preview of lists, tables, images, and code.';}};el('topics').onclick=e=>{if(e.target.dataset.filter!==undefined){filter=Number(e.target.dataset.filter);render()}};el('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};el('theme').onclick=()=>document.body.classList.toggle('dark');el('showformats').onclick=()=>location.hash='article-formats';el('showlist').onclick=()=>location.hash='list';el('showarticle').onclick=()=>location.hash='article-0';window.onhashchange=()=>{route();window.scrollTo(0,0);(location.hash.startsWith('#article')?el('atitle'):el('listing')).focus({preventScroll:true})};render();
</script></html>
